name: NanoHarness CI

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  verify-nanoharness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Evidence tests resolve frozen experiment commits and annotated tags.
          # A depth-1 checkout would make valid provenance look missing.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e '.[dev]'

      - name: Verify runtime
        run: scripts/verify.sh

      - name: Verify MCP tools
        run: scripts/verify_mcp.sh
